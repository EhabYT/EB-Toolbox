name: Build and Upload Artifacts

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Restore Dependencies
      run: msbuild EBToolbox-WinUI3.sln /t:restore /p:Platform="x64"

    - name: Build Solution
      run: msbuild EBToolbox-WinUI3.sln /p:Configuration=Release /p:Platform="x64"

    - name: Publish Application
      run: msbuild EBToolbox-WinUI3.sln /t:Publish /p:Configuration=Release /p:Platform="x64" /p:PublishDir="${{ github.workspace }}\Deploy\src\"

    # - name: Build IsWiX Installer
    #   run: dotnet build ${{ github.workspace }}\Installer\ToolboxPackaging.wixproj --configuration Release -p:DefineConstants="MSIProductVersion=1.0.0" --output "${{ github.workspace }}\artifacts\"

    - name: Compile .ISS to .EXE Installer
      uses: robin24/inno-setup-action@v1
      with:
        filepath: ${{ github.workspace }}\Installer\setup.iss

    - name: Create ZIP of MSI
      run: powershell Compress-Archive -Path "${{ github.workspace }}\Installer\Output\*" -DestinationPath "${{ github.workspace }}\EBToolbox.zip"

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: EBToolbox
        path: ${{ github.workspace }}\EBToolbox.zip
