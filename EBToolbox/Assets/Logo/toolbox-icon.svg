<?xml version="1.0" encoding="UTF-8"?>
<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#3A6CD4"/>
      <stop offset="50%" stop-color="#1A3A7A"/>
      <stop offset="100%" stop-color="#0F2252"/>
    </linearGradient>

    <!-- Body gradients for 3D depth -->
    <linearGradient id="bodyMain" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5EA0F5"/>
      <stop offset="20%" stop-color="#4A8DF0"/>
      <stop offset="50%" stop-color="#3578E5"/>
      <stop offset="80%" stop-color="#2863D4"/>
      <stop offset="100%" stop-color="#1F4FBF"/>
    </linearGradient>
    <linearGradient id="bodyFrontLight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6BB0FF" stop-opacity="0.3"/>
      <stop offset="15%" stop-color="#6BB0FF" stop-opacity="0"/>
      <stop offset="85%" stop-color="#1A3A7A" stop-opacity="0"/>
      <stop offset="100%" stop-color="#1A3A7A" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="bodyBottomEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A3A7A" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0D1F45" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Lid gradients -->
    <linearGradient id="lidMain" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7ABFFF"/>
      <stop offset="30%" stop-color="#5AA3F8"/>
      <stop offset="60%" stop-color="#4088ED"/>
      <stop offset="100%" stop-color="#2D6CD8"/>
    </linearGradient>
    <linearGradient id="lidFrontLight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8ECEFF" stop-opacity="0.35"/>
      <stop offset="20%" stop-color="#8ECEFF" stop-opacity="0"/>
      <stop offset="80%" stop-color="#2A5CC0" stop-opacity="0"/>
      <stop offset="100%" stop-color="#2A5CC0" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Handle metallic gradient -->
    <linearGradient id="handleMetal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="25%" stop-color="#F0F5FF"/>
      <stop offset="50%" stop-color="#D4E4FF"/>
      <stop offset="75%" stop-color="#B8D4FF"/>
      <stop offset="100%" stop-color="#9CBDFF"/>
    </linearGradient>
    <linearGradient id="handleHighlight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="white" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>

    <!-- Latch gradient -->
    <linearGradient id="latchOuter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3A6AD4"/>
      <stop offset="100%" stop-color="#142D5F"/>
    </linearGradient>
    <linearGradient id="latchInner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#162A50"/>
      <stop offset="100%" stop-color="#0A1528"/>
    </linearGradient>

    <!-- Clip gradient -->
    <linearGradient id="clipMain" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2A4E8A"/>
      <stop offset="50%" stop-color="#1A3466"/>
      <stop offset="100%" stop-color="#0E1E3C"/>
    </linearGradient>

    <!-- Shadows -->
    <filter id="mainShadow" x="-12%" y="-8%" width="124%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#060E1F" flood-opacity="0.55"/>
    </filter>
    <filter id="handleShadow" x="-15%" y="-20%" width="130%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#060E1F" flood-opacity="0.45"/>
    </filter>
    <filter id="innerGlow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="blur"/>
      <feOffset dx="0" dy="1" result="offset"/>
      <feFlood flood-color="white" flood-opacity="0.15" result="color"/>
      <feComposite in="color" in2="offset" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="bgClip">
      <rect x="4" y="4" width="248" height="248" rx="48"/>
    </clipPath>
  </defs>

  <g clip-path="url(#bgClip)">
    <!-- Background -->
    <rect x="4" y="4" width="248" height="248" rx="48" fill="url(#bgGrad)"/>

    <!-- Subtle background texture -->
    <g opacity="0.025">
      <circle cx="28" cy="28" r="26" fill="white"/>
      <circle cx="228" cy="228" r="18" fill="white"/>
      <circle cx="220" cy="36" r="12" fill="white"/>
      <circle cx="36" cy="224" r="8" fill="white"/>
      <circle cx="180" cy="24" r="6" fill="white"/>
      <circle cx="24" cy="140" r="10" fill="white"/>
    </g>

    <!-- Toolbox main group with shadow -->
    <g filter="url(#mainShadow)">
      <!-- Body -->
      <rect x="36" y="108" width="184" height="112" rx="12" fill="url(#bodyMain)"/>
      <!-- Body front light -->
      <rect x="36" y="108" width="184" height="112" rx="12" fill="url(#bodyFrontLight)"/>
      <!-- Body bottom edge -->
      <rect x="36" y="188" width="184" height="32" rx="0" fill="url(#bodyBottomEdge)"/>
      <!-- Body bottom rounded -->
      <rect x="36" y="212" width="184" height="8" rx="0" fill="#1A4AAF" opacity="0"/>

      <!-- Lid -->
      <rect x="32" y="90" width="192" height="28" rx="8" fill="url(#lidMain)"/>
      <rect x="32" y="90" width="192" height="28" rx="8" fill="url(#lidFrontLight)"/>

      <!-- Lid top highlight line -->
      <rect x="36" y="90" width="184" height="2" rx="1" fill="white" opacity="0.55"/>
      <!-- Lid bottom edge -->
      <rect x="32" y="114" width="192" height="3" fill="#1E4AA8" opacity="0.35"/>
      <!-- Lid inner shadow -->
      <rect x="32" y="90" width="192" height="6" rx="3" fill="white" opacity="0.12"/>
    </g>

    <!-- Body details -->
    <g opacity="0.1">
      <line x1="48" y1="156" x2="208" y2="156" stroke="white" stroke-width="1.5"/>
    </g>
    <!-- Body upper highlight -->
    <rect x="52" y="124" width="152" height="14" rx="7" fill="white" opacity="0.08"/>
    <!-- Body lower subtle highlight -->
    <rect x="52" y="172" width="152" height="10" rx="5" fill="white" opacity="0.04"/>

    <!-- Handle group -->
    <g filter="url(#handleShadow)">
      <!-- Handle outer -->
      <path d="M128,40 C72,40 58,76 58,94" stroke="url(#handleMetal)" stroke-width="20" fill="none" stroke-linecap="round"/>
      <path d="M128,40 C184,40 198,76 198,94" stroke="url(#handleMetal)" stroke-width="20" fill="none" stroke-linecap="round"/>
    </g>

    <!-- Handle inner grip (thicker, lighter) -->
    <path d="M128,48 C82,48 68,78 68,94" stroke="#E4EFFF" stroke-width="30" fill="none" stroke-linecap="round"/>
    <path d="M128,48 C174,48 188,78 188,94" stroke="#E4EFFF" stroke-width="30" fill="none" stroke-linecap="round"/>

    <!-- Handle top highlight -->
    <path d="M128,42 C88,42 74,74 74,92" stroke="white" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.5"/>
    <path d="M128,42 C168,42 182,74 182,92" stroke="white" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.5"/>

    <!-- Handle subtle bottom shadow -->
    <path d="M128,54 C90,54 78,80 78,94" stroke="#8AAAFF" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.3"/>
    <path d="M128,54 C166,54 178,80 178,94" stroke="#8AAAFF" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.3"/>

    <!-- Latch outer -->
    <rect x="100" y="76" width="56" height="32" rx="9" fill="url(#latchOuter)"/>
    <!-- Latch inner -->
    <rect x="108" y="82" width="40" height="20" rx="6" fill="url(#latchInner)"/>
    <!-- Latch top highlight -->
    <rect x="102" y="76" width="52" height="2" rx="1" fill="white" opacity="0.25"/>

    <!-- Latch detail lines -->
    <line x1="115" y1="88" x2="141" y2="88" stroke="#C8DEFF" stroke-width="2.2" stroke-linecap="round" opacity="0.75"/>
    <line x1="115" y1="92" x2="141" y2="92" stroke="#C8DEFF" stroke-width="2.2" stroke-linecap="round" opacity="0.6"/>
    <line x1="115" y1="96" x2="141" y2="96" stroke="#C8DEFF" stroke-width="2" stroke-linecap="round" opacity="0.4"/>

    <!-- Side clips -->
    <rect x="22" y="122" width="20" height="56" rx="5" fill="url(#clipMain)"/>
    <rect x="214" y="122" width="20" height="56" rx="5" fill="url(#clipMain)"/>

    <!-- Clip left highlight -->
    <rect x="24" y="124" width="5" height="52" rx="2" fill="white" opacity="0.18"/>
    <!-- Clip right highlight -->
    <rect x="227" y="124" width="5" height="52" rx="2" fill="white" opacity="0.18"/>

    <!-- Clip rivets - left -->
    <circle cx="32" cy="134" r="3" fill="#0C1A34"/>
    <circle cx="32" cy="134" r="1.2" fill="white" opacity="0.2"/>
    <circle cx="32" cy="168" r="3" fill="#0C1A34"/>
    <circle cx="32" cy="168" r="1.2" fill="white" opacity="0.2"/>

    <!-- Clip rivets - right -->
    <circle cx="224" cy="134" r="3" fill="#0C1A34"/>
    <circle cx="224" cy="134" r="1.2" fill="white" opacity="0.2"/>
    <circle cx="224" cy="168" r="3" fill="#0C1A34"/>
    <circle cx="224" cy="168" r="1.2" fill="white" opacity="0.2"/>

    <!-- EB text on body -->
    <text x="128" y="182" text-anchor="middle" font-family="'Segoe UI Variable Display', 'Segoe UI', 'Arial', sans-serif" font-size="30" font-weight="700" fill="white" opacity="0.9" letter-spacing="4">EB</text>
  </g>
</svg>
